[project]
name = "hunch"
version = "0.1.0"
description = "Judgments as code: specs, a content-addressed answer store, tests against gold, diffs, review, shadow mode"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pyyaml>=6"]

[project.optional-dependencies]
pydantic = ["pydantic>=2"]

[project.scripts]
hunch = "hunch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hunch"]
