# yaml-language-server: $schema=https://raw.githubusercontent.com/oneryalcin/hunch/main/src/hunch/spec.schema.json
# TREC 2010 Legal Track, topic 302: the request as written and the senior lawyer's reading of it, condensed from the track's guidelines (see NOTICE.md).
judgment: spills
model: jev-1.13.0
source: .cache/spills.csv     # built by fetch.py
key: id
weights:     # the judged emails are a stratified sample of 455,449; each stratum's share of them
  by: stratum
  population: {'0.008433668': 0.98937851, '0.3559945': 0.00952356, '0.6': 0.00010979, '0.625': 0.00010189, '0.6521739': 0.00010101, '0.719697': 0.0002868, '1': 0.00049845}
state: [email, attachments]
clip: {email: 6000, attachments: 2000}
questions:
  spills:
    type: noul
    instructions: >-
      `email` is an email from Enron's files and `attachments` the text of its attachments, if any. In a
      lawsuit, the other side asked Enron to produce "All documents or communications that describe,
      discuss, refer to, report on, or relate to actual, anticipated, possible or potential responses to oil
      and gas spills, blowouts or releases, or pipeline eruptions, whether past, present or future,
      including, but not limited to, any assessment, evaluation, remediation or repair activities,
      contingency plans and/or environmental disaster, recovery or clean-up efforts." The senior lawyer on
      the case reads the request narrowly. The email must mention both an unplanned leak, spill or release
      of oil or gas (real or hypothetical, by any company, anywhere) and a response to it: an assessment of
      the incident or of the ability to respond, a contingency plan, remediation or clean-up, training for
      such responses, an environmental study of the incident, or an evaluation of any of these. Documents
      about those activities count, such as a spill-response manual or an email scheduling spill training. A
      contract counts if it sets out a party's duties to respond to a spill. Not responsive: a spill with no
      response; planned releases; drilling bans; contracts that only set money owed for a spill; legal
      rulings that don't mention a response; legal duties under foreign law; content not in English. Does
      this email, with its attachments, fall under that request?
    gold: gold

tests:                    # a regression bar, set below what was measured (AUROC 0.902)
  spills: {min_auroc: 0.87}
