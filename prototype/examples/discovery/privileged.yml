# yaml-language-server: $schema=https://raw.githubusercontent.com/oneryalcin/hunch/main/src/hunch/spec.schema.json
# TREC 2010 Legal Track, topic 304: the request as written and the senior lawyer's reading of it, condensed from the track's guidelines (see NOTICE.md).
judgment: privileged
model: jev-1.13.0
source: .cache/privileged.csv     # built by fetch.py
key: id
weights:     # the judged emails are a stratified sample of 455,449; each stratum's share of them
  by: stratum
  population: {'0.008223829': 0.87478094, '0.04659498': 0.0018386, '0.04753521': 0.0012477, '0.04761905': 0.00166067, '0.04807692': 0.00068536, '0.04823151': 0.00068316, '0.04878049': 0.00045031, '0.04887218': 0.00058431, '0.05555556': 0.00011862, '0.06064783': 0.00318735, '0.06118665': 0.00710838, '0.06131852': 0.01827009, '0.06146429': 0.02912707, '0.06173686': 0.05120099, '0.06185819': 0.00894881, '0.1818182': 2.416e-05, '0.2': 2.197e-05, '0.25': 1.757e-05, '0.4': 2.197e-05, '0.6666667': 1.318e-05, '1': 8.79e-06}
state: [email, attachments]
clip: {email: 6000, attachments: 2000}
questions:
  privileged:
    type: noul
    instructions: >-
      `email` is an email from Enron's files and `attachments` the text of its attachments, if any. In a
      lawsuit, Enron may withhold from the other side any document protected by attorney-client privilege or
      as attorney work product. The senior lawyer on the case applies two protections; either one is enough.
      Attorney-client privilege: a communication between lawyers (in-house or outside) and the company's
      employees, or among employees discussing legal advice, whose main purpose is to seek or give legal
      advice or a legal service such as drafting a contract, and kept confidential. Sharing it with an
      independent outsider, or spreading it widely inside the company without any expectation of confidence,
      usually ends the privilege. Work product: material prepared by employees or lawyers in anticipation of
      litigation (including regulatory, administrative or legislative proceedings where each side can
      present evidence), pending or reasonably expected, and not shared with the other side; litigation
      strategy is included. If any part of the email or of an attachment would be blacked out as protected,
      the whole email counts. A draft contract shared with the other party counts only if it contains a
      request for or a piece of legal advice. Merely naming lawyers or listing their assignments does not
      count, and a confidentiality label is a sign, not proof. Would Enron's lawyers withhold this email,
      with its attachments, on one of those grounds?
    gold: gold

tests:                    # a regression bar, set below what was measured (AUROC 0.894)
  privileged: {min_auroc: 0.87}
