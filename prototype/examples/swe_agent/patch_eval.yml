judgment: patch_eval
model: jev-1.13.0
source: traces.csv
key: id
state: [issue, final_messages, patch]

questions:
  resolved:
    type: noul
    instructions: >-
      Would this patch make the project's own tests for this issue pass, fully resolving
      the `issue` as described? Judge the `patch` itself, not what the agent says about it.
    act: {yes: 0.90, no: 0.80}   # a confident "no" is far more reliable than a confident "yes"
    gold: resolved

  claims_fixed:
    type: noul
    instructions: In its `final_messages`, does the agent claim that it has fixed the issue?

tests:
  resolved:
    min_auroc: 0.70
    max_calibration_error: 0.10
    base_rate: 0.167   # 13,389 of 80,036 runs in the full dataset pass; traces.csv is a 50/50 sample
