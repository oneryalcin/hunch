# Ablation of patch_eval.yml: the same question with the agent's final messages removed from the state.
# Does the agent saying "fixed it" sway the verdict? Compare: hunch diff patch_only.yml --against patch_eval.yml
judgment: patch_only
model: jev-1.13.0
source: traces.csv
key: id
state: [issue, patch]
weights:   # traces.csv is 50/50 on `resolved`; across all 80,036 runs 13,389 pass (16.7%)
  by: resolved
  population: {yes: 0.167, no: 0.833}

questions:
  passes_tests:
    type: noul
    instructions: >-
      Would this patch make the project's own tests for this issue pass, fully resolving
      the `issue` as described? Judge the `patch` itself, not what the agent says about it.
    act: {yes: 0.90, no: 0.80}   # a confident "no" is far more reliable than a confident "yes"
    gold: resolved

tests:
  passes_tests:
    min_auroc: 0.70
    max_calibration_error: 0.10
