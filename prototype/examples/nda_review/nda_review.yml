# yaml-language-server: $schema=https://raw.githubusercontent.com/oneryalcin/hunch/main/src/hunch/spec.schema.json
# A first read of a non-disclosure agreement: five clauses a reviewer checks, each "says so", "says otherwise" or
# "not mentioned". ContractNLI's test split (CC BY 4.0, see NOTICE.md): 123 real NDAs, labelled by lawyers.
judgment: nda_review
model: jev-1.13.0
source: contractnli_test.csv
key: id
state: [text]
clip: {text: 60000}
questions:
  must_be_marked:
    type: choice
    instructions: In this non-disclosure agreement (`text`), must information be expressly identified or marked as confidential by the disclosing party to count as Confidential Information?
    criteria:
      says_so: The agreement expressly says only information that is marked, labelled or expressly identified as confidential (or confirmed as such in writing) is protected
      says_otherwise: The agreement expressly says information is protected even when it is not marked or identified (e.g. "whether or not marked", oral information not confirmed in writing)
      not_mentioned: The agreement doesn't expressly say either way. A broad definition of Confidential Information alone is not_mentioned
    gold: gold_must_be_marked
  advisors_allowed:
    type: choice
    instructions: In this non-disclosure agreement (`text`), may the receiving party share confidential information with third parties such as consultants, agents, or professional advisors?
    criteria:
      says_so: Sharing with some third parties (consultants, agents, advisors, contractors) is allowed, even if on conditions
      says_otherwise: The agreement expressly limits disclosure so that no third party outside the receiving party (and its employees) may receive it
      not_mentioned: The agreement doesn't expressly address third parties such as consultants, agents or advisors; a general duty not to disclose is not_mentioned
    gold: gold_advisors_allowed
  copies_allowed:
    type: choice
    instructions: In this non-disclosure agreement (`text`), may the receiving party make copies of confidential information in some circumstances?
    criteria:
      says_so: The agreement expressly allows copies in some circumstances (for the purpose, with consent, as needed)
      says_otherwise: The agreement expressly prohibits making copies
      not_mentioned: The agreement doesn't expressly address making copies; a duty to return "all copies" alone is not_mentioned
    gold: gold_copies_allowed
  may_keep_after_return:
    type: choice
    instructions: In this non-disclosure agreement (`text`), when confidential information must be returned or destroyed, may the receiving party still keep some of it (for example archival copies, copies required by law, or automatic backups)?
    criteria:
      says_so: Some confidential information may be kept after the return or destruction obligation (archival, legal, backup or similar copies)
      says_otherwise: The agreement expressly says no copy may be kept (e.g. "all copies" must be destroyed "and none retained")
      not_mentioned: The agreement doesn't expressly address keeping anything; a duty to return or destroy information alone is not_mentioned
    gold: gold_may_keep_after_return
  survives_termination:
    type: choice
    instructions: In this non-disclosure agreement (`text`), do some of the receiving party's obligations continue after the agreement ends or is terminated?
    criteria:
      says_so: The agreement expressly says some obligations survive or continue after it terminates or expires
      says_otherwise: The agreement expressly says the obligations end when it ends
      not_mentioned: The agreement doesn't expressly say what happens to its obligations after it ends; a confidentiality period counted from disclosure alone is not_mentioned
    gold: gold_survives_termination
