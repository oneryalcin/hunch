# Step 1: what does the agent say about its own work? A three-way answer, because traces can be cut off
# or ambiguous and a forced yes/no guesses confidently (review panel: 10 of 40 traces were "unclear").
judgment: claims
model: jev-1.13.0
source: ../../examples/swe_agent/traces.csv   # replace with your own traces: one row per agent run
key: id
state: [final_messages]
weights:   # traces.csv is 50/50 on `resolved`; across all 80,036 runs 13,389 pass (16.7%)
  by: resolved
  population: {yes: 0.167, no: 0.833}
questions:
  claim:
    type: choice
    instructions: In these `final_messages`, what does the agent say about whether it fixed the issue it was working on?
    criteria:
      claimed_fixed: The agent states or clearly implies that the fix is done and works
      no_claim: The agent says it could not fix it, gave up, or makes no claim about success
      unclear: The messages are cut off or too ambiguous to tell
