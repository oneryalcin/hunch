<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">Reading map for a generated Hunch report</title>
  <desc id="desc">The project page lists judgments and their statuses. Selecting a judgment leads to its status reason, evidence with a measurement basis, the exact question and criteria, and then technical details. This is a schematic map, not a screenshot.</desc>
  <style>
    text { font-family: system-ui, -apple-system, Segoe UI, sans-serif; fill: #243237; }
    .title { font-size: 20px; font-weight: 700; }
    .label { font-size: 17px; font-weight: 650; }
    .small { font-size: 14px; }
    .shell { fill: #FAFAF7; stroke: #B8C9CA; stroke-width: 2; }
    .row { fill: #F0F4F3; stroke: #C5D4D2; stroke-width: 1.4; }
    .alert { fill: #FFF2EB; stroke: #B7654D; stroke-width: 1.6; }
    .line { stroke: #607C81; stroke-width: 2.5; marker-end: url(#tip); }
  </style>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#607C81"/></marker></defs>
  <rect width="920" height="360" fill="#FFFFFF"/>
  <rect x="15" y="20" width="330" height="320" rx="15" class="shell"/>
  <text x="37" y="57" class="title">Project page</text>
  <text x="37" y="82" class="small">Find the judgment that needs attention</text>
  <rect x="36" y="107" width="288" height="60" rx="9" class="alert"/>
  <text x="52" y="134" class="label">Judgment with a failed check</text><text x="52" y="155" class="small">Status explains why</text>
  <rect x="36" y="181" width="288" height="54" rx="9" class="row"/>
  <text x="52" y="214" class="label">Judgment awaiting evidence</text>
  <rect x="36" y="249" width="288" height="54" rx="9" class="row"/>
  <text x="52" y="282" class="label">Judgment that passed</text>
  <line x1="345" y1="141" x2="390" y2="141" class="line"/>
  <rect x="395" y="20" width="510" height="320" rx="15" class="shell"/>
  <text x="417" y="57" class="title">Judgment page</text>
  <text x="417" y="82" class="small">Read the cause before the supporting detail</text>
  <rect x="416" y="104" width="468" height="49" rx="8" class="alert"/>
  <text x="431" y="134" class="label">1. Status reason: the failed check</text>
  <rect x="416" y="166" width="468" height="43" rx="8" class="row"/>
  <text x="431" y="193" class="label">2. Evidence: value, limit and basis</text>
  <rect x="416" y="221" width="468" height="43" rx="8" class="row"/>
  <text x="431" y="248" class="label">3. Question and answer criteria</text>
  <rect x="416" y="276" width="468" height="43" rx="8" class="row"/>
  <text x="431" y="303" class="label">4. Technical reference and consumers</text>
</svg>
