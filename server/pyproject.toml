[project]
name = "hunch-server"
version = "0.1.0"
description = "hunch server: online judgments, the review queue, runs and drift over hunch specs"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["hunch", "starlette>=0.40", "uvicorn>=0.30", "python-multipart>=0.0.9"]

[tool.uv.sources]
hunch = { path = "..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hunch_server"]
