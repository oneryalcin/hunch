name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # release.yml runs this same gate before publishing

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Lock files carry no personal uv settings (exempt-package lists name other projects)
        run: "! grep -n 'exclude-newer-package' uv.lock server/uv.lock"
      - name: Lint (ruff, pinned; config in pyproject.toml)
        run: uvx ruff@0.16.8 check .
      - name: Every spec key, CLI flag and environment variable is documented
        run: uv run docs-site/check.py && uv run docs-site/benchmark.py --check
      - name: The reference engine plugin (plugins/hunch-engine-ollama) passes its smoke tests against this hunch
        run: |
          uv venv -q /tmp/plugin-venv && uv pip install -q --python /tmp/plugin-venv -e . -e plugins/hunch-engine-ollama pytest
          cd plugins/hunch-engine-ollama && /tmp/plugin-venv/bin/python -m pytest -q -p no:cacheprovider
      - name: The quickstart's recipe is a valid spec
        run: uv run hunch lint src/hunch/recipes/agent_commands && uv run hunch lint src/hunch/recipes/tickets && uv run hunch lint src/hunch/recipes/rag_answers
      - name: The files hunch writes match their published schemas (batteries' results.json; a manifest from hunch docs)
        run: |
          uvx check-jsonschema@0.38.0 --schemafile src/hunch/results.schema.json src/hunch/recipes/*/results*.json
          uv run hunch docs src/hunch/recipes/rag_answers > /dev/null
          uvx check-jsonschema@0.38.0 --schemafile src/hunch/manifest.schema.json .hunch/target/src/hunch/recipes/rag_answers.manifest.json
      - name: The site builds
        working-directory: docs-site
        run: npx -y mint@latest validate
      - name: No broken links or anchors
        working-directory: docs-site
        run: npx -y mint@latest broken-links --check-anchors
